{% extends 'blog/base.html' %}

{% block title %}注册{% endblock %}

{% block content %}
    <h2>注册新账号</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">注册</button>
    </form>
    <p>已有账号？<a href="{% url 'login' %}">立即登录</a></p>
{% endblock %}
